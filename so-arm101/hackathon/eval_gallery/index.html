<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SO-101 Eval Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Ambient wall of rollouts (the April eval gallery's design), plus Opus tiles, scores and a click-to-watch viewer.
     One deliberate dark look: every color is set here. */
  :root {
    color-scheme: dark;
    --bg: #0b0b0d;
    --fg: #e8e8ea;
    --dim: #8a8a92;
    --panel: rgba(11, 11, 13, 0.78);
    --act: #2E5EAA;
    --smolvla: #3D8B5C;
    --pi05: #D97706;
    --opus: #A855F7;
    --ok: #4ade80;
    --fail: #f87171;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--fg);
               font-family: var(--sans); overflow: hidden; }
  #title { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
           font: 700 26px/1 var(--mono); letter-spacing: 0.18em; z-index: 100; pointer-events: none; white-space: nowrap;
           text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 0 30px rgba(0,0,0,0.85); }
  #title .accent { color: var(--opus); }
  #status { position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
            font: 600 11px/1.2 var(--mono); color: var(--dim); letter-spacing: 0.05em; z-index: 100;
            pointer-events: none; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.9); transition: opacity 800ms; }

  #thanks { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; pointer-events: none; opacity: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 70%); }
  #thanks .big { font: 800 clamp(40px, 8vw, 96px)/1 var(--mono); letter-spacing: 0.16em; margin-bottom: 18px;
                 text-shadow: 0 4px 30px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.7); }
  #thanks .sub { font: 600 24px/1 var(--mono); letter-spacing: 0.22em; color: var(--opus);
                 text-shadow: 0 2px 18px rgba(0,0,0,0.95); }

  #wall { display: grid; gap: 2px; width: 100vw; height: 100vh; padding: 2px; background: #000; }
  .tile { position: relative; overflow: hidden; background: #000; aspect-ratio: 16/9; cursor: pointer;
          filter: grayscale(1) brightness(0.5) contrast(0.92);
          transition: filter 600ms ease, transform 600ms ease, box-shadow 600ms ease; will-change: filter, transform; }
  .tile:hover, .tile:focus-visible { filter: grayscale(0.2) brightness(0.85); outline: none; }
  .tile video, .tile .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .poster { z-index: 1; }
  .tile video.bg { z-index: 2; }
  .tile video.fg { z-index: 3; opacity: 0; transition: opacity 350ms ease; }
  .tile.hot video.fg { opacity: 1; }
  .tile.hot { filter: none; transform: scale(1.85); z-index: 30; box-shadow: 0 0 0 2px var(--accent), 0 18px 60px rgba(0,0,0,0.85); }
  .tile[data-policy="ACT"]     { --accent: var(--act); }
  .tile[data-policy="SmolVLA"] { --accent: var(--smolvla); }
  .tile[data-policy="Pi05"]    { --accent: var(--pi05); }
  .tile[data-policy="Opus"]    { --accent: var(--opus); }

  .lbl { position: absolute; z-index: 5; font: 600 12px/1 var(--mono); color: var(--fg); padding: 2px 4px;
         background: rgba(0,0,0,0.65); backdrop-filter: blur(2px); opacity: 0; transition: opacity 350ms ease;
         pointer-events: none; letter-spacing: 0.02em; white-space: nowrap; max-width: calc(100% - 4px);
         overflow: hidden; text-overflow: ellipsis; }
  .tile.hot .lbl { opacity: 1; }
  .lbl.tl { top: 2px; left: 2px; }
  .lbl.tl-sub { top: 20px; left: 2px; font: 600 7px/1 var(--mono); letter-spacing: 0.03em; padding: 1px 3px;
                color: var(--accent); background: rgba(0,0,0,0.5); }
  .lbl.tr { top: 2px; right: 2px; }
  .lbl.bl { bottom: 2px; left: 2px; color: var(--accent); }
  .lbl.br { bottom: 2px; right: 2px; font-size: 8px; color: var(--dim); }
  .lbl.ok { color: var(--ok); }
  .lbl.fail { color: var(--fail); }

  #legend { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
            display: grid; grid-template-columns: auto auto auto; gap: 6px 14px; align-items: center;
            font: 600 11px/1 var(--mono); color: var(--dim); z-index: 100; background: var(--panel);
            padding: 10px 12px; border-radius: 4px; backdrop-filter: blur(4px); font-variant-numeric: tabular-nums; }
  #legend .head { color: var(--dim); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
  #legend .name { color: var(--fg); white-space: nowrap; }
  #legend .num { text-align: right; color: var(--fg); }
  #legend .num.best { color: var(--ok); }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: middle; border-radius: 1px; }
  #hint { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
          font: 600 11px/1.3 var(--mono); color: var(--dim); background: var(--panel); padding: 8px 12px; border-radius: 4px;
          z-index: 100; max-width: 46vw; text-align: right; }

  #viewer { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
                     max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #viewer .card { width: min(1100px, 100%); max-height: 100%; overflow: auto; background: #111114;
                  border: 1px solid #26262c; border-top: 3px solid var(--accent); border-radius: 6px; }
  #viewer video { display: block; width: 100%; aspect-ratio: 16/9; background: #000; }
  #viewer .meta { padding: 16px 20px 20px; display: grid; gap: 14px; }
  #viewer .head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
  #viewer .head h2 { margin: 0; font: 700 20px/1.2 var(--sans); text-wrap: balance; }
  #viewer .who { font: 600 13px/1 var(--mono); color: var(--accent); }
  #viewer .res { font: 700 12px/1 var(--mono); }
  #viewer .res.ok { color: var(--ok); } #viewer .res.fail { color: var(--fail); }
  #viewer .close { margin-left: auto; font: 600 13px/1 var(--mono); color: var(--fg); background: #1d1d22;
                   border: 1px solid #33333a; border-radius: 4px; padding: 7px 10px; cursor: pointer; }
  #viewer .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #viewer .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0; }
  #viewer .stats div { background: #17171b; border-radius: 4px; padding: 10px 12px; min-width: 0; }
  #viewer dt { font: 600 10px/1.2 var(--mono); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
  #viewer dd { margin: 6px 0 0; font: 700 18px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
  #viewer dd small { font: 500 12px/1.3 var(--sans); color: var(--dim); display: block; margin-top: 2px; }
  #viewer .say { margin: 0; font: 400 14px/1.55 var(--sans); color: #c9c9cf; max-width: 75ch; }
  #viewer .say b { color: var(--fg); font-weight: 600; }
  #viewer .note { font: 500 12px/1.4 var(--sans); color: var(--dim); margin: 0; }

  @media (max-width: 640px) {
    #title { font-size: 18px; } #status { top: calc(44px + env(safe-area-inset-top, 0px)); }
    #hint { display: none; }
    #legend { font-size: 10px; gap: 4px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .tile video.fg, .lbl { transition: none; }
    .tile.hot { transform: none; }
  }
</style>
</head>

      meta.append(el('p', { class: 'note' }, 'Real-time recording of the robot dashboard: overhead camera, wrist camera and the agent’s tool calls.'));
    } else {
      meta.append(el('p', { class: 'note' }, `${m.name} trained on ${d.variant} (April 2026 study, ${GALLERY.il_note}). Clip plays at 4× speed.`));
    }
    VIEWER.replaceChildren(el('div', { class: 'card' }, video, meta));
    VIEWER.hidden = false;
    close.focus();
  }
  function closeViewer() {
    const v = VIEWER.querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    VIEWER.hidden = true; VIEWER.replaceChildren();
  }
  VIEWER.addEventListener('click', (e) => { if (e.target === VIEWER) closeViewer(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !VIEWER.hidden) closeViewer(); });

  function main() {
    renderLegend();
    $('hint').append(GALLERY.hint, el('br'), 'Click any tile to watch it.');
    const g = pickGridForViewport();
    const cols = g.cols, rows = g.rows;
    // Every Opus run always gets a tile; IL rollouts of the same two tasks fill the rest of the wall.
    const opus = GALLERY.tiles.filter(d => d.policy === 'Opus');
    const il = shuffle(GALLERY.tiles.filter(d => d.policy !== 'Opus'));
    const data = shuffle([...opus, ...il].slice(0, Math.max(g.capacity, opus.length)));
    WALL.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    WALL.style.gridTemplateRows = `repeat(${Math.ceil(data.length / cols)}, 1fr)`;

    const tiles = [], byPolicy = {};
    data.forEach((d, i) => {
      const tile = el('div', { class: 'tile', tabindex: '0', role: 'button',
                               'aria-label': `${d.title}, ${d.policy_name}, ${d.success ? 'success' : 'failure'}` });
      tile.dataset.policy = d.policy;
      tile.dataset.row = String(Math.floor(i / cols));
      tile.dataset.col = String(i % cols);
      const bg = el('video', { class: 'bg', playsinline: '', preload: 'auto', loop: '' });
      bg.muted = true; bg.src = d.clip_lo || d.clip;
      const fg = el('video', { class: 'fg', playsinline: '', preload: 'none', loop: '' });
      fg.muted = true; fg.dataset.src = d.clip;
      tile.append(
        el('img', { class: 'poster', loading: 'lazy', decoding: 'async', src: d.poster, alt: '' }), bg, fg,
        el('div', { class: 'lbl tl' }, d.task),
        el('div', { class: 'lbl tl-sub' }, d.sub),
        el('div', { class: 'lbl tr ' + (d.success ? 'ok' : 'fail') }, d.success ? 'SUCCESS' : 'FAILURE'),
        el('div', { class: 'lbl bl' }, d.policy_name),
        el('div', { class: 'lbl br' }, `×${d.speed}`));
      tile.addEventListener('click', () => openViewer(d));
      tile.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(d); } });
      WALL.append(tile);
      tiles.push(tile);
      (byPolicy[d.policy] = byPolicy[d.policy] || []).push(tile);
    });

    STATUS.textContent = `${data.length} rollouts · ${opus.length} by Opus 5.5 + MCP · ${data.length - opus.length} by the IL policies`;
    setTimeout(() => { STATUS.style.opacity = '0'; }, 5000);

    const realRows = Math.ceil(data.length / cols);
    const isInterior = (t) => { const r = +t.dataset.row, c = +t.dataset.col; return r > 0 && r < realRows - 1 && c > 0 && c < cols - 1; };
    const isFar = (t, picks) => picks.every(p => Math.max(Math.abs(+t.dataset.row - +p.dataset.row),
                                                          Math.abs(+t.dataset.col - +p.dataset.col)) >= 2);
    const slots = Array.from({ length: HIGHLIGHT_COUNT }, () => ({ tile: null, timer: null, gen: 0 }));
    const recent = new Set();

    function pickReplacement(i) {
      const others = slots.filter((_, j) => j !== i).map(s => s.tile).filter(Boolean);
      const otherSet = new Set(others), otherPolicies = new Set(others.map(t => t.dataset.policy));
      const eligible = (pool) => pool.filter(t => !otherSet.has(t) && !recent.has(t) && isInterior(t) && isFar(t, others));
      // Keep one Opus run in the spotlight; otherwise prefer a model not already showing.
      const order = otherPolicies.has('Opus')
        ? [...shuffle(['ACT', 'SmolVLA', 'Pi05']).filter(p => !otherPolicies.has(p)), ...shuffle(['ACT', 'SmolVLA', 'Pi05', 'Opus'])]
        : ['Opus'];
      for (const p of order) {
        const pool = eligible(byPolicy[p] || []);
        if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
      }
      for (const f of [t => !otherSet.has(t) && isInterior(t) && isFar(t, others), t => !otherSet.has(t) && isInterior(t), t => !otherSet.has(t)]) {
        const pool = tiles.filter(f);
        if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
      }
      return null;
    }
    function deactivate(tile) {
      if (!tile) return;
      tile.classList.remove('hot');
      const v = tile.querySelector('video.fg');
      try { v.pause(); } catch (e) {}
      v.removeAttribute('src'); v.load();
    }
    function activate(tile) {
      const v = tile.querySelector('video.fg');
      return new Promise((resolve) => {
        let done = false;
        const finish = () => {
          if (done) return; done = true;
          v.play().catch(() => {});
          resolve(Number.isFinite(v.duration) && v.duration > 0 ? v.duration : null);
        };
        v.addEventListener('loadedmetadata', finish, { once: true });
        v.addEventListener('error', finish, { once: true });
        setTimeout(finish, 2000);
        v.src = v.dataset.src; v.load();
        tile.classList.add('hot');
      });
    }
    async function rotate(i) {
      const slot = slots[i];
      if (slot.timer) clearTimeout(slot.timer);
      const old = slot.tile, next = pickReplacement(i), gen = ++slot.gen;
      slot.tile = next;
      if (old) { recent.add(old); if (recent.size > 4 * HIGHLIGHT_COUNT) recent.delete(recent.values().next().value); deactivate(old); }
      if (!next) return;
      const dur = await activate(next);
      if (slot.gen !== gen || slot.tile !== next) return;
      const hold = Math.max(MIN_HIGHLIGHT_MS, Math.min(MAX_HIGHLIGHT_MS, dur ? dur * 1000 : FALLBACK_HIGHLIGHT_MS));
      slot.timer = setTimeout(() => rotate(i), hold);
    }
    document.querySelectorAll('video.bg').forEach((v, i) => setTimeout(() => {
      try { if (Number.isFinite(v.duration) && v.duration > 0) v.currentTime = Math.random() * Math.min(2, v.duration * 0.5); } catch (e) {}
      v.play().catch(() => {});
    }, i * 30));
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      for (let i = 0; i < HIGHLIGHT_COUNT; i++) setTimeout(() => rotate(i), i * 350);
    }

    // Embedded in a deck as an iframe: hand slide-navigation keys back to the deck.
    if (window.parent && window.parent !== window) {
      const NAV = new Set(['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' ', 'Home', 'End']);
      window.addEventListener('keydown', (e) => {
        if (NAV.has(e.key) && VIEWER.hidden) window.parent.postMessage({ type: 'gallery-nav-key', key: e.key }, '*');
      });
    }
    // Closing slide: open with #thanks to show THANK YOU / questions? for 6 s.
    if (location.hash === '#thanks') {
      const t = $('thanks');
      requestAnimationFrame(() => { t.style.transition = 'opacity 0.4s ease-out'; t.style.opacity = '1'; });
      setTimeout(() => { t.style.transition = 'opacity 1.5s ease-in'; t.style.opacity = '0'; }, 6400);
      setTimeout(() => { t.style.display = 'none'; }, 8000);
    }
    let resizeTO;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTO);
      resizeTO = setTimeout(() => {
        const c = pickGridForViewport().cols;
        WALL.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
        WALL.style.gridTemplateRows = `repeat(${Math.ceil(tiles.length / c)}, 1fr)`;
      }, 200);
    });
  }
  main();
</script>

</body>
</html>
